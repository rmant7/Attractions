<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found | Cheap Trip</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 100px 20px; }
        h1   { color: #e74c3c; }
        a    { color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>404 - Oops! Page Not Found</h1>
    <p>The page you're looking for doesn't exist (or has been moved).</p>
    <p><a href="{{ url_for('index') }}">← Go back to homepage</a></p>

    
    <p>Try in another language:</p>
    <ul style="list-style: none; padding: 0;">
        
        <li><a href="{{ switch_lang_url(lang) }}">{{ lang_name[lang] }}</a></li>
        
    </ul>
    
</body>
</html>
